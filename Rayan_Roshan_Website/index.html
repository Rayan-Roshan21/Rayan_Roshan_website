<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/R.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Rayan Roshan — Computer Science student at TMU building AI systems, voice agents, and scalable products. Explore projects, experience, and more." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Rayan Roshan</title>
  <link rel="canonical" href="https://rayanroshan.com/" />

  <!-- Open Graph / Twitter. The app is a client-rendered SPA, so this
       static head is the only thing link scrapers ever see — LinkedIn,
       Slack, iMessage and X never run the bundle. Per-route titles are
       rendered by the page components (React 19 hoists them), which
       covers browser tabs and Google's deferred second pass; these tags
       cover the unfurl. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rayanroshan.com/" />
  <meta property="og:title" content="Rayan Roshan | Software Engineer" />
  <meta property="og:description" content="CS co-op student at TMU. VP of Technology at BYTE. I build full-stack products and applied AI systems that ship to real users." />
  <meta property="og:image" content="https://rayanroshan.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Rayan Roshan — Software Engineer" />
  <meta property="og:site_name" content="Rayan Roshan" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rayan Roshan | Software Engineer" />
  <meta name="twitter:description" content="CS co-op student at TMU. VP of Technology at BYTE. Full-stack + applied AI." />
  <meta name="twitter:image" content="https://rayanroshan.com/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter variable, with the optical-size axis so glyph shapes adapt
       to the size they are set at rather than being scaled uniformly. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
